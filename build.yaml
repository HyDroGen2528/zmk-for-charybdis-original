# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: charybdis_left
  - board: nice_nano_v2
    shield: charybdis_right
  - board: nice_nano_v2
    shield: charybdis_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: settings_reset
  # Diagnostic images expose USB serial logs while retaining split BLE roles.
  - board: nice_nano_v2
    shield: charybdis_right
    snippet: zmk-usb-logging
    artifact-name: charybdis_right-debug-nice_nano_v2-zmk
    cmake-args: -DCONFIG_ASSERT=y -DCONFIG_STACK_SENTINEL=y
  - board: nice_nano_v2
    shield: charybdis_dongle
    snippet: studio-rpc-usb-uart zmk-usb-logging
    artifact-name: charybdis_dongle-debug-nice_nano_v2-zmk
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ASSERT=y -DCONFIG_STACK_SENTINEL=y
