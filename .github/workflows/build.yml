name: Build Nano35 SavingPower firmware

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: Also build right and dongle USB logging firmware
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUILD_IMAGE: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5

jobs:
  matrix:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: matrix
        env:
          ENABLE_DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        run: |
          python3 - <<'PY'
          import json, os, yaml
          with open("build.yaml") as source:
              matrix = yaml.safe_load(source)
          if os.environ["ENABLE_DEBUG"] == "true":
              for shield in ("charybdis_right", "charybdis_dongle"):
                  dongle = shield == "charybdis_dongle"
                  matrix["include"].append({
                      "board": "nice_nano@2.0.0/nrf52840/zmk",
                      "shield": shield,
                      "snippet": ("studio-rpc-usb-uart " if dongle else "") + "zmk-usb-logging",
                      "cmake-args": ("-DCONFIG_ZMK_STUDIO=y " if dongle else "") +
                                    "-DCONFIG_ASSERT=y -DCONFIG_STACK_SENTINEL=y",
                      "artifact-name": f"{shield}-debug-nice_nano_v2-zmk",
                  })
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          PY

  build:
    needs: matrix
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    name: Build ${{ matrix.artifact-name }}
    env:
      BOARD: ${{ matrix.board }}
      SHIELD: ${{ matrix.shield }}
      SNIPPETS: ${{ matrix.snippet }}
      CMAKE_ARGS: ${{ matrix.cmake-args }}
      ARTIFACT_NAME: ${{ matrix.artifact-name }}
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            modules
            tools
            zephyr
            bootloader
            zmk
            zmk-*
          key: nano35-west-${{ hashFiles('config/west.yml') }}
          restore-keys: nano35-west-
      - name: Fetch pinned dependencies
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
          echo "BUILD_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
      - name: Build firmware
        run: |
          python3 - <<'PY'
          import os, shlex, subprocess
          command = ["west", "build", "-s", "zmk/app", "-d", os.environ["BUILD_DIR"],
                     "-b", os.environ["BOARD"]]
          for snippet in shlex.split(os.environ["SNIPPETS"]):
              command += ["-S", snippet]
          command += ["--", "-DZMK_CONFIG=" + os.environ["GITHUB_WORKSPACE"] + "/config",
                      "-DSHIELD=" + os.environ["SHIELD"]]
          command += shlex.split(os.environ["CMAKE_ARGS"])
          subprocess.run(command, check=True)
          PY
      - name: Collect firmware and build information
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shlex, shutil, subprocess
          from west.manifest import Manifest, ManifestProject
          build = pathlib.Path(os.environ["BUILD_DIR"])
          output = build / "artifacts"
          output.mkdir()
          artifact = os.environ["ARTIFACT_NAME"]
          shutil.copyfile(build / "zephyr/zmk.uf2", output / f"{artifact}.uf2")
          cache = {}
          for line in (build / "CMakeCache.txt").read_text().splitlines():
              if line.startswith(("CMAKE_C_COMPILER:", "ZEPHYR_SDK_INSTALL_DIR:")):
                  key, value = line.split("=", 1)
                  cache[key.split(":", 1)[0]] = value
          compiler = subprocess.check_output([cache["CMAKE_C_COMPILER"], "--version"], text=True)
          resolved = Manifest.from_topdir()
          projects = [{"name": project.name, "url": project.url, "path": project.path,
                       "revision": project.sha("HEAD")}
                      for project in resolved.projects
                      if not isinstance(project, ManifestProject) and resolved.is_active(project)]
          manifest = {
              "uf2": f"{artifact}.uf2", "board": os.environ["BOARD"],
              "shield": os.environ["SHIELD"], "snippets": shlex.split(os.environ["SNIPPETS"]),
              "cmake_args": shlex.split(os.environ["CMAKE_ARGS"]),
              "source_commit": os.environ["GITHUB_SHA"], "image": os.environ["BUILD_IMAGE"],
              "compiler": compiler.splitlines()[0], "sdk_path": cache.get("ZEPHYR_SDK_INSTALL_DIR"),
              "dependencies": projects,
          }
          (output / f"{artifact}.build.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nano35-${{ matrix.artifact-name }}
          path: ${{ env.BUILD_DIR }}/artifacts
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: nano35-*
          path: firmware
          merge-multiple: true
      - name: Create manifest and checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          directory = pathlib.Path("firmware")
          builds = []
          dependencies = None
          for path in sorted(directory.glob("*.build.json")):
              build = json.loads(path.read_text())
              projects = build.pop("dependencies")
              if dependencies is None:
                  dependencies = projects
              if projects != dependencies:
                  raise SystemExit("Firmware targets used different dependency revisions")
              build["sha256"] = hashlib.sha256((directory / build["uf2"]).read_bytes()).hexdigest()
              builds.append(build)
              path.unlink()
          if not builds:
              raise SystemExit("No firmware build information found")
          manifest = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"], "ref": os.environ["GITHUB_REF"],
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] +
                         "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "dependencies": dependencies, "builds": builds,
          }
          (directory / "build-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          checksums = [hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.name
                       for path in sorted(directory.iterdir()) if path.is_file()]
          (directory / "SHA256SUMS").write_text("\n".join(checksums) + "\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firmware
          path: firmware
          if-no-files-found: error
          retention-days: 90
