description: |
  Sensor driver for the pixart PMW3610 mouse sensor

compatible: "zmk,pmw3610-legacy"

include: spi-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
  scroll-layers:
    type: array
    default: []
  snipe-layers:
    type: array
    default: []
  automouse-layer:
    type: int
    default: -1
